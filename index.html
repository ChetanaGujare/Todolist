<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6fc;
            color: #1a1a2e;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 820px;
            width: 100%;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
        }
        .page-header h1 small {
            font-weight: 400;
            font-size: 16px;
            color: #7a879b;
            margin-left: 10px;
        }
        .date-badge {
            background: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #eef2f7;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .focus-banner {
            background: linear-gradient(135deg, #eef3ff 0%, #f7f9fe 100%);
            border-radius: 18px;
            padding: 18px 24px;
            margin-bottom: 24px;
            border: 1px solid #e2eaf9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }
        .focus-banner .focus-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .focus-banner .focus-icon {
            width: 44px;
            height: 44px;
            background: #3b5bdb;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .focus-banner .focus-text h3 {
            font-size: 17px;
            font-weight: 700;
        }
        .focus-banner .focus-text p {
            font-size: 14px;
            color: #5a6a7e;
            font-weight: 500;
        }
        .focus-banner .focus-text p span {
            background: #dce3ef;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #2d3b66;
            margin-left: 6px;
        }
        .focus-badge {
            background: #3b5bdb;
            color: #fff;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .tabs {
            display: flex;
            gap: 2px;
            background: #f0f4fc;
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 22px;
            width: fit-content;
        }
        .tabs button {
            background: transparent;
            border: none;
            padding: 10px 28px;
            border-radius: 11px;
            font-weight: 600;
            font-size: 14px;
            color: #5a6a7e;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tabs button.active {
            background: #ffffff;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tabs button:hover:not(.active) {
            color: #1a1a2e;
        }

        .task-section {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px 30px 30px 30px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f7;
            margin-bottom: 28px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i {
            color: #5b7cfa;
        }
        .section-sub {
            font-size: 14px;
            color: #7a879b;
            margin-bottom: 20px;
        }

        .add-task-row {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .add-task-row input {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: #fafbff;
            outline: none;
            transition: border 0.2s;
        }
        .add-task-row input:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 4px rgba(91, 124, 250, 0.08);
        }
        .add-task-row button {
            background: #3b5bdb;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .add-task-row button:hover {
            background: #2d4bc4;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            max-height: 540px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .task-list::-webkit-scrollbar {
            width: 5px;
        }
        .task-list::-webkit-scrollbar-track {
            background: #f0f4fc;
            border-radius: 10px;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: #cdd7e6;
            border-radius: 10px;
        }

        .task-card {
            background: #f9faff;
            border-radius: 14px;
            padding: 16px 20px;
            border: 1px solid #edf2f7;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .task-card:hover {
            border-color: #d5dfee;
            background: #f5f8ff;
        }
        .task-card .task-check {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border-radius: 7px;
            border: 2px solid #cbd5e1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: transparent;
            font-size: 13px;
        }
        .task-card .task-check.done {
            background: #3b5bdb;
            border-color: #3b5bdb;
            color: #fff;
        }
        .task-card .task-check.done i {
            color: #fff;
        }
        .task-card .task-body {
            flex: 1;
            min-width: 0;
        }
        .task-card .task-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            transition: color 0.2s;
        }
        .task-card .task-title.completed {
            color: #9aa5b5;
            text-decoration: line-through;
        }
        .task-card .task-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 4px;
        }
        .task-card .task-tags .tag {
            background: #eef3ff;
            color: #3b5bdb;
            font-size: 11px;
            font-weight: 600;
            padding: 1px 12px;
            border-radius: 30px;
            letter-spacing: 0.3px;
        }
        .task-card .status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 30px;
            margin-left: 8px;
            white-space: nowrap;
        }
        .status-badge.done {
            background: #e6f7ee;
            color: #38a169;
        }
        .status-badge.pending {
            background: #fff5e6;
            color: #d69e2e;
        }
        .task-card .task-delete {
            background: transparent;
            border: none;
            color: #bcc8db;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 8px;
            opacity: 0.4;
            transition: all 0.2s;
        }
        .task-card:hover .task-delete {
            opacity: 1;
        }
        .task-card .task-delete:hover {
            color: #e53e3e;
            background: #fff0f0;
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 32px 16px 20px;
            color: #9aa5b5;
        }
        .empty-state i {
            font-size: 32px;
            color: #dce3ef;
            margin-bottom: 10px;
            display: block;
        }

        .task-stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid #edf2f7;
            margin-top: 4px;
        }
        .task-stats .stat-group {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .task-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #4a5568;
        }
        .task-stats .stat-item strong {
            color: #1a1a2e;
            font-size: 16px;
        }
        .task-stats .stat-item .badge {
            background: #eef3ff;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #3b5bdb;
        }
        .clear-all-btn {
            background: transparent;
            border: 1px solid #e2e8f0;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            color: #7a879b;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .clear-all-btn:hover {
            background: #fff5f5;
            border-color: #feb2b2;
            color: #e53e3e;
        }

        .review-section {
            margin-top: 8px;
            display: flex;
            justify-content: flex-end;
        }
        .review-btn {
            background: #1a1a2e;
            color: #fff;
            border: none;
            padding: 14px 40px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 14px rgba(26, 26, 46, 0.12);
        }
        .review-btn:hover {
            background: #2d2d4a;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: #9aa5b5;
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
        }

        @media (max-width: 600px) {
            .container { padding: 0; }
            .task-section { padding: 20px 16px; }
            .tabs button { padding: 8px 16px; font-size: 13px; }
            .focus-banner { flex-direction: column; align-items: stretch; }
            .task-card { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1>Learning Schedule <small>Stay on track</small></h1>
            <div class="date-badge">
                <i class="far fa-calendar-alt"></i>
                <span id="currentDate"></span>
            </div>
        </div>

        <!-- Today's Focus -->
        <div class="focus-banner">
            <div class="focus-left">
                <div class="focus-icon"><i class="fas fa-bullseye"></i></div>
                <div class="focus-text">
                    <h3>Today's Focus: Client-Side Todo List App</h3>
                    <p>
                        <i class="far fa-calendar-check" style="margin-right:6px;color:#5b7cfa;"></i>
                        Day 8
                        <span id="focusTaskCount">6 tasks</span>
                    </p>
                </div>
            </div>
            <div class="focus-badge" id="focusBadge">
                <i class="fas fa-arrow-right"></i> 6 remaining
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="active" id="tabToday"><i class="fas fa-sun" style="margin-right:6px;"></i> Today</button>
            <button id="tabUpcoming"><i class="far fa-clock" style="margin-right:6px;"></i> Upcoming</button>
            <button id="tabDone"><i class="fas fa-check-circle" style="margin-right:6px;"></i> Done</button>
        </div>

        <!-- Task Section -->
        <div class="task-section">
            <div class="section-title">
                <i class="fas fa-list-check"></i> Task Implementation Steps
            </div>
            <div class="section-sub">All tasks from your learning plan — mark complete as you go.</div>

            <div class="add-task-row">
                <input type="text" id="taskInput" placeholder="Add a new task…" autocomplete="off" />
                <button id="addTaskBtn"><i class="fas fa-plus"></i> Add Task</button>
            </div>

            <div class="task-list" id="taskList"></div>

            <div class="task-stats">
                <div class="stat-group">
                    <span class="stat-item"><i class="far fa-circle" style="color:#bcc8db;"></i> Total: <strong id="totalCount">0</strong></span>
                    <span class="stat-item"><i class="fas fa-check-circle" style="color:#38a169;"></i> Done: <strong id="doneCount">0</strong></span>
                    <span class="stat-item"><span class="badge" id="progressBadge">0%</span></span>
                </div>
                <button class="clear-all-btn" id="clearAllBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
            </div>
        </div>

        <!-- Review button -->
        <div class="review-section">
            <button class="review-btn" id="reviewBtn"><i class="fas fa-thumbs-up"></i> I've Reviewed the Steps</button>
        </div>

        <!-- Footer -->
        <div class="footer">&copy; 2026 — All rights reserved</div>
    </div>

    <script>
        (function() {
            'use strict';

            const taskListEl = document.getElementById('taskList');
            const taskInput = document.getElementById('taskInput');
            const addBtn = document.getElementById('addTaskBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const reviewBtn = document.getElementById('reviewBtn');
            const totalCountEl = document.getElementById('totalCount');
            const doneCountEl = document.getElementById('doneCount');
            const progressBadge = document.getElementById('progressBadge');
            const focusTaskCount = document.getElementById('focusTaskCount');
            const focusBadge = document.getElementById('focusBadge');
            const currentDateEl = document.getElementById('currentDate');

            let tasks = [];
            const STORAGE_KEY = 'learning_tasks_final_v2';

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // Exactly the 6 tasks from your image
            function getDefaultTasks() {
                return [
                    { id: generateId(), title: 'Add localStorage to save and load todo items across sessions', tags: ['JavaScript', 'Storage'], done: false },
                    { id: generateId(), title: 'Create HTML structure for the todo list', tags: ['HTML', 'CSS'], done: false },
                    { id: generateId(), title: 'Write JS functions to add and delete tasks', tags: ['JavaScript'], done: false },
                    { id: generateId(), title: 'Implement localStorage.setItem to store the task array', tags: ['JavaScript', 'Storage'], done: false },
                    { id: generateId(), title: 'Load tasks from localStorage on page load', tags: ['JavaScript', 'Storage'], done: false },
                    { id: generateId(), title: 'Test adding, removing, and persisting tasks', tags: ['JavaScript', 'Testing'], done: false }
                ];
            }

            function saveTasks() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (_) {}
            }

            function loadTasks() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            tasks = parsed;
                            return;
                        }
                    }
                } catch (_) {}
                tasks = getDefaultTasks();
                saveTasks();
            }

            function render(filter = 'all') {
                let filtered = tasks;
                if (filter === 'done') filtered = tasks.filter(t => t.done);
                else if (filter === 'pending') filtered = tasks.filter(t => !t.done);

                const sorted = [...filtered].sort((a, b) => {
                    if (a.done === b.done) return 0;
                    return a.done ? 1 : -1;
                });

                if (sorted.length === 0) {
                    const msg = filter === 'done' ? 'No completed tasks yet.' :
                                filter === 'pending' ? 'All tasks are completed! 🎉' :
                                'No tasks yet — add one above!';
                    taskListEl.innerHTML = `
                        <div class="empty-state">
                            <i class="far fa-smile"></i>
                            <p>${msg}</p>
                        </div>
                    `;
                } else {
                    let html = '';
                    sorted.forEach((task, index) => {
                        const checked = task.done ? 'done' : '';
                        const titleClass = task.done ? 'completed' : '';
                        const statusText = task.done ? 'Completed' : 'In Progress';
                        const statusClass = task.done ? 'done' : 'pending';

                        html += `
                            <div class="task-card" data-id="${task.id}">
                                <div class="task-check ${checked}" data-id="${task.id}">
                                    ${task.done ? '<i class="fas fa-check"></i>' : ''}
                                </div>
                                <div class="task-body">
                                    <div class="task-title ${titleClass}">
                                        ${escapeHtml(task.title)}
                                        <span class="status-badge ${statusClass}">${statusText}</span>
                                    </div>
                                    <div class="task-tags">
                                        ${task.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
                                    </div>
                                </div>
                                <button class="task-delete" data-id="${task.id}" title="Delete">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        `;
                    });
                    taskListEl.innerHTML = html;
                }

                const total = tasks.length;
                const done = tasks.filter(t => t.done).length;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                totalCountEl.textContent = total;
                doneCountEl.textContent = done;
                progressBadge.textContent = total === 0 ? '0%' : pct + '%';

                const pending = tasks.filter(t => !t.done).length;
                focusTaskCount.textContent = `${pending} task${pending !== 1 ? 's' : ''}`;
                focusBadge.innerHTML = `<i class="fas fa-arrow-right"></i> ${pending} remaining`;

                saveTasks();
            }

            function addTask(text) {
                const trimmed = text.trim();
                if (!trimmed) return false;
                tasks.push({ id: generateId(), title: trimmed, tags: [], done: false });
                render();
                return true;
            }

            function deleteTask(id) {
                tasks = tasks.filter(t => t.id !== id);
                render();
            }

            function toggleTask(id) {
                const task = tasks.find(t => t.id === id);
                if (task) { task.done = !task.done; render(); }
            }

            function clearAllTasks() {
                if (tasks.length === 0) return;
                if (confirm('Delete all tasks?')) { tasks = []; render(); }
            }

            // Event delegation
            taskListEl.addEventListener('click', (e) => {
                const check = e.target.closest('.task-check');
                if (check) { const id = check.dataset.id; if (id) toggleTask(id); return; }
                const delBtn = e.target.closest('.task-delete');
                if (delBtn) { const id = delBtn.dataset.id; if (id) deleteTask(id); return; }
                const titleEl = e.target.closest('.task-title');
                if (titleEl) {
                    const card = titleEl.closest('.task-card');
                    if (card) { const id = card.dataset.id; if (id) toggleTask(id); }
                }
            });

            addBtn.addEventListener('click', () => {
                const val = taskInput.value;
                if (addTask(val)) { taskInput.value = ''; taskInput.focus(); }
                else {
                    taskInput.style.borderColor = '#e53e3e';
                    setTimeout(() => taskInput.style.borderColor = '', 400);
                }
            });
            taskInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
            });

            clearAllBtn.addEventListener('click', clearAllTasks);

            reviewBtn.addEventListener('click', () => {
                const done = tasks.filter(t => t.done).length;
                const total = tasks.length;
                if (total === 0) alert('📝 No tasks yet. Add some to get started!');
                else if (done === total) alert('🎉 Amazing! You\'ve completed all tasks!');
                else alert(`📊 You've completed ${done} out of ${total} tasks. Keep going! 💪`);
            });

            // Tabs
            let currentFilter = 'all';
            document.querySelectorAll('.tabs button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const id = this.id;
                    if (id === 'tabToday') currentFilter = 'all';
                    else if (id === 'tabDone') currentFilter = 'done';
                    else if (id === 'tabUpcoming') currentFilter = 'pending';
                    render(currentFilter);
                });
            });

            function setDate() {
                const now = new Date();
                const opts = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                currentDateEl.textContent = now.toLocaleDateString('en-US', opts);
            }

            loadTasks();
            render('all');
            setDate();
            taskInput.focus();
        })();
    </script>
</body>
</html>
