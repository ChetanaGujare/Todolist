<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List · Task Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="app-container">

        <!-- ====== SIDEBAR ====== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">✓</div>
                <span>TaskFlow</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="#"><i class="fas fa-tasks"></i> My Tasks</a>
                <a href="#"><i class="fas fa-calendar"></i> Schedule</a>
                <a href="#"><i class="fas fa-chart-line"></i> Progress</a>
                <a href="#"><i class="fas fa-cog"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </div>
                <div class="user-avatar">CG</div>
            </div>
        </aside>

        <!-- ====== MAIN CONTENT ====== -->
        <main class="main-content">

            <!-- Header -->
            <header class="main-header">
                <div>
                    <h1>Learning Schedule</h1>
                    <p class="header-sub"><i class="fas fa-calendar-check"></i> Stay on track · Day 8</p>
                </div>
                <div class="header-actions">
                    <div class="date-badge" id="currentDate">
                        <i class="far fa-calendar-alt"></i>
                        <span></span>
                    </div>
                    <div class="notification-bell">
                        <i class="far fa-bell"></i>
                        <span class="notif-dot"></span>
                    </div>
                </div>
            </header>

            <!-- ====== FOCUS CARD ====== -->
            <section class="focus-card">
                <div class="focus-content">
                    <div class="focus-icon-wrapper">
                        <div class="focus-icon"><i class="fas fa-bullseye"></i></div>
                    </div>
                    <div class="focus-info">
                        <h3>Today's Focus</h3>
                        <p>Client-Side Todo List App</p>
                        <div class="focus-meta">
                            <span><i class="far fa-calendar-check"></i> Day 8</span>
                            <span class="focus-task-count" id="focusTaskCount">6 tasks remaining</span>
                        </div>
                    </div>
                </div>
                <div class="focus-progress-ring">
                    <svg viewBox="0 0 120 120">
                        <circle cx="60" cy="60" r="50" fill="none" stroke="#eef2f8" stroke-width="8" />
                        <circle cx="60" cy="60" r="50" fill="none" stroke="#4f46e5" stroke-width="8"
                            stroke-linecap="round"
                            stroke-dasharray="314.159"
                            stroke-dashoffset="314.159"
                            id="focusRing" />
                    </svg>
                    <span class="focus-ring-text" id="focusPercent">0%</span>
                </div>
            </section>

            <!-- ====== TABS ====== -->
            <div class="tabs-container">
                <div class="tabs">
                    <button class="active" id="tabToday"><i class="fas fa-list-ul"></i> All</button>
                    <button id="tabUpcoming"><i class="far fa-clock"></i> Pending</button>
                    <button id="tabDone"><i class="fas fa-check-circle"></i> Done</button>
                </div>
                <button class="add-task-btn" id="addTaskBtn"><i class="fas fa-plus"></i> New Task</button>
            </div>

            <!-- ====== TASK SECTION ====== -->
            <section class="task-section">

                <!-- Quick Add -->
                <div class="quick-add">
                    <input type="text" id="taskInput" placeholder="What do you want to accomplish?" autocomplete="off" />
                    <button id="addQuickBtn"><i class="fas fa-arrow-right"></i></button>
                </div>

                <!-- Task List -->
                <div class="task-list" id="taskList"></div>

                <!-- Stats -->
                <div class="task-footer">
                    <div class="task-stats">
                        <div class="stat-item">
                            <span class="stat-value" id="totalCount">0</span>
                            <span class="stat-label">Total</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="doneCount">0</span>
                            <span class="stat-label">Done</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value" id="pendingCount">0</span>
                            <span class="stat-label">Pending</span>
                        </div>
                    </div>
                    <button class="clear-btn" id="clearAllBtn">
                        <i class="fas fa-trash-alt"></i> Clear All
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
                </div>
            </section>

            <!-- ====== REVIEW BUTTON ====== -->
            <div class="review-wrapper">
                <button class="review-btn" id="reviewBtn">
                    <i class="fas fa-thumbs-up"></i> I've Reviewed the Steps
                    <span class="review-badge" id="reviewBadge">0/6</span>
                </button>
            </div>

            <!-- ====== FOOTER ====== -->
            <footer class="app-footer">
                <p>&copy; 2026 — Made with <i class="fas fa-heart"></i> by Chetana Gujare</p>
                <div class="footer-links">
                    <a href="#"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </footer>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
